# Repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (same as backend).
# Private key must be multiline OpenSSH format; do not use the .pub file.

name: Deploy frontend

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Set repository secrets DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY."
            exit 1
          fi
          FIRST=$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r' | sed '/./!d' | head -n1)
          if printf '%s' "$FIRST" | grep -qE '^(ssh-rsa|ssh-ed25519|ssh-dss|ecdsa-sha2)'; then
            echo "::error::DEPLOY_SSH_KEY looks like a public key (starts with ssh-…). Paste the private key file (e.g. github_actions_knooz), not the .pub file."
            exit 1
          fi

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s << 'ENDSSH'
          set -euo pipefail
          APP_DIR=/opt/knooz/knooz-system-frontend
          cd "$APP_DIR"
          DEFAULT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git fetch origin "$DEFAULT_BRANCH"
          git reset --hard "origin/${DEFAULT_BRANCH}"
          npm ci
          export VITE_API_BASE_URL=/api
          npm run build
          chmod -R o+rX apps/web/dist
          nginx -t
          systemctl reload nginx
          ENDSSH
